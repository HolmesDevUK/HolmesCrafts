{% extends "base.html" %}

{% load static %}

{% block title %} Password Reset | {{ block.super }} {% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'accounts/styles/password_reset.css' %}">
{% endblock %}

{% block content %}
<h1>Set new password</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Change password</button>
</form>
{% endblock %}
