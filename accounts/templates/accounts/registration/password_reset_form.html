{% extends "base.html" %}

{% load static %}

{% block title %} Password Reset | {{ block.super }} {% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'accounts/styles/password_reset.css' %}">
{% endblock %}

{% block content %}
<h1>Reset password</h1>
<form method="post">
  {% csrf_token %}
  {{ form.email.label_tag }}<br>
  {{ form.email }}
  <button type="submit">Send reset link</button>
</form>
{% endblock %}
